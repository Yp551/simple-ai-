<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Search</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main container -->
    <div class="container">

        <!-- Logo / Title -->
        <h1>My Search</h1>

        <p class="subtitle">
            Search the web. Ask anything.
        </p>

        <!-- Search area -->
        <div class="search-area">

            <div class="search-box">

                <!-- Search icon -->
                <span class="search-icon">⌕</span>

                <!-- Search input -->
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search anything..."
                    autocomplete="off"
                >

                <!-- Microphone button -->
                <button
                    class="mic-btn"
                    type="button"
                    title="Voice Search"
                >
                    🎙️
                </button>

            </div>

            <!-- Search button -->
            <button
                class="search-btn"
                type="button"
            >
                Search
            </button>

        </div>

        <!-- Quick suggestions -->
        <div class="suggestions">

            <span>Try searching:</span>

            <button>Python</button>
            <button>Artificial Intelligence</button>
            <button>Machine Learning</button>

        </div>

    </div>

</body>

</html>
